# Dependency management: use uv (https://github.com/astral-sh/uv)
# Setup:  uv venv .venv --python 3.11 && uv pip install -r requirements-dev.txt
# Run:    source .venv/bin/activate (or use .venv/bin/python directly)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-engagement-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = ["S101", "B008"]  # S101: assert in tests; B008: FastAPI Depends() pattern

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --cov=backend --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/tests/*", "*/alembic/*"]
